{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/favicon-16x16.png?v=5">
<link rel="shortcut icon" type="image/x-icon" href="{{ base_path }}/images/favicon.ico?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png?v=5">
<link rel="manifest" href="{{ base_path }}/images/site.webmanifest?v=5">
<meta name="theme-color" content="#f7f7f5">

<meta name="color-scheme" content="light">

<!-- Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
